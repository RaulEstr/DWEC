<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            text-align: center;
            margin: 5px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>RADIO BUTTON</h1>
    <form id="formu">
        <h3>Procesador</h3>
        <input type="radio" name="procesador" id="procesador1" value="Mac Pro 2,0 Mhz" checked><label for="procesador1">Mac Pro 2,0 Mhz</label><br>
        <input type="radio" name="procesador" id="procesador2" value="Intel i3 1,9 Mhz"><label for="procesador2">Intel i3 1,9 Mhz</label><br>
        <input type="radio" name="procesador" id="procesador3" value="Intel i5 2,2 Mhz"><label for="procesador3">Intel i5 2,2 Mhz</label><br>
        <h3>Sistema Operativo</h3>
        <input type="radio" name="sistema" id="sistema1" value="Windows XP" checked><label for="sistema1">Windows XP</label><br>
        <input type="radio" name="sistema" id="sistema2" value="Windows 7"><label for="sistema2">Windows 7</label><br>
        <input type="radio" name="sistema" id="sistema3" value="Windows Server 2008"><label for="sistema3">Windows Server 2008</label><br><br>
        <input type="button" id="enviar" value="ENVIAR">
        <input type="button" id="limpiar" value="LIMPIAR">
    </form>
    <script type="text/javascript" src="scripts/ejercicio2.js" defer></script>
</body>
</html>
